services:
  pitchbin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - data:/data
    command:
      - -addr
      - ":8080"
      - -db
      - /data/pitchbin.db
      - -base-url
      - ${PITCHBIN_BASE_URL:-https://pitchbin.xyz}
      - -pow-bits
      - ${PITCHBIN_POW_BITS:-20}
    restart: unless-stopped

volumes:
  data:
