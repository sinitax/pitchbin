services:
  pitchbin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    command:
      - -addr
      - ":8080"
      - -db
      - /data/pitchbin.db
      - -base-url
      - ${PITCHBIN_BASE_URL:-http://localhost:8080}
      - -pow-bits
      - ${PITCHBIN_POW_BITS:-20}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    profiles:
      - tls

volumes:
  data:
  caddy_data:
  caddy_config:
