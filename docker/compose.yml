services:
  pitchbin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - data:/data
    command:
      - -addr
      - ":8080"
      - -db
      - /data/pitchbin.db
      - -base-url
      - ${PITCHBIN_BASE_URL:-https://pitchbin.xyz}
      - -pow-bits
      - ${PITCHBIN_POW_BITS:-20}
    restart: unless-stopped
    networks:
      - default
      - docker-ingress
    labels:
      - traefik.enable=true
      - traefik.http.routers.pitchbin.rule=Host(`${PITCHBIN_DOMAIN:-pitchbin.xyz}`)
      - traefik.http.routers.pitchbin.entrypoints=websecure
      - traefik.http.routers.pitchbin.tls.certresolver=letsencrypt
      - traefik.http.services.pitchbin.loadbalancer.server.port=8080

volumes:
  data:

networks:
  docker-ingress:
    external: true
